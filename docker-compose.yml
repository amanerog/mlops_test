# Entorno completo de los laboratorios.
#   docker compose up -d lab        -> sesiones 1 y 2: MLflow y el contenedor de trabajo
#   docker compose up -d            -> sesión 3: además, Ollama y la descarga de los modelos
#   docker compose exec lab bash    -> abre una terminal dentro del contenedor de trabajo
#   MLflow: http://localhost:5050

services:
  mlflow:
    build: .
    image: iffe-mlops-labs:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5050,127.0.0.1,127.0.0.1:5050
    ports:
      - "5050:5000"  # en macOS el 5000 lo ocupa AirPlay
    volumes:
      - mlflow-data:/mlflow

  ollama:
    image: ollama/ollama:0.40.8
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  # Descarga los modelos la primera vez (después quedan guardados en el volumen)
  ollama-modelos:
    image: ollama/ollama:0.40.8
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull qwen2.5:1.5b && ollama pull qwen2.5:0.5b && ollama pull embeddinggemma"]
    restart: "no"

  lab:
    image: iffe-mlops-labs:latest
    depends_on:
      - mlflow
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - .:/workspace
    ports:
      - "5001:5001"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OLLAMA_BASE_URL: http://ollama:11434/v1
      MODEL_URL: http://127.0.0.1:5001

volumes:
  mlflow-data:
  ollama-models:
